name: 💥 Crash report
description: The game crashes or doesn't start with the mod installed.
title: "[Crash] "
labels: ["crash", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry about the crash! The crash report is the most important part, without it the crash usually can't be fixed.
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "26.1.2"
        - "1.21"
        - "1.20.1"
        - "Other (write it in the description)"
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Fabric
        - NeoForge
        - Forge
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: "1.1.1"
    validations:
      required: true
  - type: input
    id: crash-report
    attributes:
      label: Crash report
      description: |
        Upload the newest file from `crash-reports/` (or `logs/latest.log` if there is none) to [mclo.gs](https://mclo.gs) and paste the link here.
      placeholder: https://mclo.gs/...
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: When does it crash?
      description: On startup, when joining a world, when placing a specific block, ...
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods or modpack
      description: Which other mods are installed, or which modpack are you playing? Does the crash also happen with only this mod installed?
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this crash isn't reported yet.
          required: true
